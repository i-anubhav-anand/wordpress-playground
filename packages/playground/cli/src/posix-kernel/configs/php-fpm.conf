[global]
daemonize = no
error_log = /dev/stderr
log_level = notice

[www]
; The port is per-boot (reserveFreePort) so concurrent vitest workers
; can each boot a kernel without colliding on a hard-coded 9000.
listen = 127.0.0.1:__FPM_PORT__

; php-fpm refuses to start as root without an explicit user/group.
; kandelo's sys_setuid drops workers to uid 99 — the tempdir and
; database dir are chmodded 0o777 so they can traverse and write.
user = nobody
group = nobody

pm = dynamic
pm.max_children = 4
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3

clear_env = no

slowlog = /dev/null
request_slowlog_trace_depth = 0

; php-fpm is started with `-c /dev/null` (no php.ini), so PHP falls
; back to compiled-in defaults — display_errors=On under FastCGI.
; That writes E_USER_NOTICE/E_WARNING into the response body, e.g.
; wp_version_check()'s trigger_error() output prepended to wp-admin
; HTML, which then trips "headers already sent" cascades. Disable
; in-response display; errors still flow to stderr via the global
; error_log = /dev/stderr above.
php_admin_flag[display_errors] = off

; With fix_pathinfo=1 (compile-time default) FPM resolves the script
; by truncating SCRIPT_FILENAME at each `/`; router.php sits at the
; tempdir root so every truncation lands on a directory and FPM bails
; with "Primary script unknown". router.php doesn't read PATH_INFO.
php_admin_value[cgi.fix_pathinfo] = 0
